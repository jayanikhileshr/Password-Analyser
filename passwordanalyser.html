<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Password Strength Analyzer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: monospace;
    background: #f5f5f3;
    color: #1a1a1a;
    min-height: 100vh;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 2rem 1rem;
  }

  .card {
    background: #fff;
    border: 1px solid #e0ddd6;
    border-radius: 12px;
    padding: 2rem;
    width: 100%;
    max-width: 560px;
  }

  h1 { font-size: 16px; font-weight: 500; letter-spacing: 0.04em; margin-bottom: 1.5rem; }

  .label {
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: #888;
    margin-bottom: 6px;
  }

  #pw-wrapper { position: relative; margin-bottom: 1.25rem; }

  #pw-input {
    width: 100%;
    font-family: monospace;
    font-size: 15px;
    padding: 10px 44px 10px 12px;
    border: 1px solid #d3d1c7;
    border-radius: 8px;
    background: #fff;
    color: #1a1a1a;
    outline: none;
  }

  #pw-input:focus { border-color: #888; }

  #toggle-vis {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    cursor: pointer;
    color: #888;
    font-size: 18px;
  }

  #strength-bar-track {
    height: 6px;
    background: #e0ddd6;
    border-radius: 99px;
    overflow: hidden;
    margin-bottom: 0.5rem;
  }

  #strength-bar-fill {
    height: 100%;
    border-radius: 99px;
    transition: width 0.35s ease, background 0.35s ease;
    width: 0%;
  }

  .strength-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 1.25rem;
  }

  #strength-label { font-size: 13px; font-weight: 500; color: #aaa; }
  #crack-time { font-size: 12px; color: #888; }

  .checks-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 1.25rem 0; }

  .check-item { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #888; }

  .check-icon {
    width: 18px; height: 18px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; flex-shrink: 0;
    border: 1px solid #d3d1c7;
    color: #aaa;
    transition: all 0.2s;
  }

  .check-item.pass .check-icon { background: #1D9E75; border-color: #1D9E75; color: white; }
  .check-item.pass { color: #1a1a1a; }

  .divider { border: none; border-top: 1px solid #e0ddd6; margin: 1.25rem 0; }

  .entropy-row { display: flex; gap: 12px; margin-top: 1rem; }

  .entropy-card { flex: 1; background: #f5f5f3; border-radius: 8px; padding: 10px 14px; }
  .entropy-val { font-size: 20px; font-weight: 500; }
  .entropy-desc { font-size: 11px; color: #888; margin-top: 2px; }

  .section-label { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: #888; margin-bottom: 10px; }

  .suggestion-tag {
    display: inline-flex;
    font-size: 12px;
    padding: 4px 10px;
    border-radius: 99px;
    border: 1px solid #d3d1c7;
    background: #f5f5f3;
    color: #888;
    margin: 0 4px 6px 0;
  }

  .suggestion-tag.warn  { border-color: #BA7517; background: #FAEEDA; color: #633806; }
  .suggestion-tag.danger { border-color: #A32D2D; background: #FCEBEB; color: #501313; }

  .alt-card {
    display: flex; align-items: center; justify-content: space-between;
    border: 1px solid #e0ddd6; border-radius: 8px;
    padding: 10px 14px; margin-bottom: 8px; gap: 12px;
  }

  .alt-pw { font-family: monospace; font-size: 13px; word-break: break-all; flex: 1; }

  .copy-btn {
    font-size: 13px; padding: 4px 10px; flex-shrink: 0;
    cursor: pointer; background: none;
    border: 1px solid #d3d1c7; border-radius: 8px;
    color: #888; font-family: monospace;
  }

  .copy-btn:hover { background: #f5f5f3; }
</style>
</head>
<body>
<div class="card">
  <h1>Password Strength Analyzer</h1>

  <p class="label">Enter password</p>
  <div id="pw-wrapper">
    <input id="pw-input" type="password" placeholder="Type a password…" autocomplete="new-password" />
    <button id="toggle-vis" aria-label="Toggle visibility"><i class="ti ti-eye"></i></button>
  </div>

  <div id="strength-bar-track"><div id="strength-bar-fill"></div></div>
  <div class="strength-row">
    <span id="strength-label">—</span>
    <span id="crack-time"></span>
  </div>

  <div class="checks-grid" id="checks-grid"></div>

  <hr class="divider" />

  <div class="entropy-row">
    <div class="entropy-card"><div class="entropy-val" id="entropy-val">0</div><div class="entropy-desc">bits of entropy</div></div>
    <div class="entropy-card"><div class="entropy-val" id="charset-val">0</div><div class="entropy-desc">character pool</div></div>
    <div class="entropy-card"><div class="entropy-val" id="len-val">0</div><div class="entropy-desc">length</div></div>
  </div>

  <hr class="divider" />

  <p class="section-label">Feedback</p>
  <div id="suggestions"></div>

  <div style="margin-top:1.25rem">
    <p class="section-label">Stronger alternatives</p>
    <div id="alternatives"></div>
  </div>
</div>

<script>
const pwInput       = document.getElementById('pw-input');
const toggleBtn     = document.getElementById('toggle-vis');
const bar           = document.getElementById('strength-bar-fill');
const strengthLabel = document.getElementById('strength-label');
const crackTime     = document.getElementById('crack-time');
const checksGrid    = document.getElementById('checks-grid');
const entropyVal    = document.getElementById('entropy-val');
const charsetVal    = document.getElementById('charset-val');
const lenVal        = document.getElementById('len-val');
const suggestionsDiv = document.getElementById('suggestions');
const altDiv        = document.getElementById('alternatives');

toggleBtn.addEventListener('click', () => {
  const hidden = pwInput.type === 'password';
  pwInput.type = hidden ? 'text' : 'password';
  toggleBtn.querySelector('i').className = hidden ? 'ti ti-eye-off' : 'ti ti-eye';
});

const COMMON = ['password','123456','qwerty','letmein','iloveyou','admin','welcome',
  'monkey','dragon','master','sunshine','abc123','pass','login','trustno1','shadow','superman','batman'];

const CHECKS = [
  { label: '8+ characters',     test: p => p.length >= 8 },
  { label: '12+ characters',    test: p => p.length >= 12 },
  { label: 'Uppercase letter',  test: p => /[A-Z]/.test(p) },
  { label: 'Lowercase letter',  test: p => /[a-z]/.test(p) },
  { label: 'Number',            test: p => /\d/.test(p) },
  { label: 'Symbol (!@#…)',      test: p => /[^A-Za-z0-9]/.test(p) },
  { label: 'Not a common word', test: p => !COMMON.some(w => p.toLowerCase().includes(w)) },
  { label: 'No repeated chars', test: p => !/(.)\1\1/.test(p) },
];

const LEVELS = [
  { label: 'Very weak',   color: '#E24B4A', pct: 15  },
  { label: 'Weak',        color: '#EF9F27', pct: 35  },
  { label: 'Fair',        color: '#FAC775', pct: 55  },
  { label: 'Strong',      color: '#1D9E75', pct: 78  },
  { label: 'Very strong', color: '#0F6E56', pct: 100 },
];

function charsetSize(pw) {
  let s = 0;
  if (/[a-z]/.test(pw)) s += 26;
  if (/[A-Z]/.test(pw)) s += 26;
  if (/\d/.test(pw))    s += 10;
  if (/[^A-Za-z0-9]/.test(pw)) s += 32;
  return s || 1;
}

function entropy(pw) {
  return Math.round(pw.length * Math.log2(charsetSize(pw)));
}

function crackEstimate(bits) {
  const s = Math.pow(2, bits) / 1e10;
  if (s < 1)          return 'instant';
  if (s < 60)         return `${Math.round(s)}s`;
  if (s < 3600)       return `${Math.round(s/60)}min`;
  if (s < 86400)      return `${Math.round(s/3600)}h`;
  if (s < 31536000)   return `${Math.round(s/86400)} days`;
  if (s < 3153600000) return `${Math.round(s/31536000)} years`;
  return `${(s/31536000/1e6).toFixed(1)}M years`;
}

function score(pw) {
  if (!pw) return -1;
  const e = entropy(pw);
  if (e < 28) return 0;
  if (e < 40) return 1;
  if (e < 56) return 2;
  if (e < 72) return 3;
  return 4;
}

function buildFeedback(pw, sc) {
  const tags = [];
  if (COMMON.some(w => pw.toLowerCase().includes(w))) tags.push({ text: 'Contains a common word', cls: 'danger' });
  if (pw.length < 8)       tags.push({ text: 'Too short (min 8 chars)', cls: 'danger' });
  else if (pw.length < 12) tags.push({ text: 'Consider 12+ chars', cls: 'warn' });
  if (!/[A-Z]/.test(pw))  tags.push({ text: 'Add uppercase', cls: 'warn' });
  if (!/[a-z]/.test(pw))  tags.push({ text: 'Add lowercase', cls: 'warn' });
  if (!/\d/.test(pw))     tags.push({ text: 'Add a number',  cls: 'warn' });
  if (!/[^A-Za-z0-9]/.test(pw)) tags.push({ text: 'Add a symbol', cls: 'warn' });
  if (/(.)\1\1/.test(pw)) tags.push({ text: 'Avoid repeated chars', cls: 'warn' });
  if (sc >= 4) tags.push({ text: '✓ Excellent password', cls: '' });
  else if (sc === 3) tags.push({ text: '✓ Good — could be longer', cls: '' });
  return tags;
}

const WORDS = ['coral','ember','frost','grove','lunar','maple','noble','olive',
  'prism','quartz','river','solar','terra','ultra','vivid','cedar','delta','echo','flora','glint'];
const SYMBOLS = '!@#$%^&*()-_=+[]{}|;:,.<>?';

function generateAlts() {
  const rand = arr => arr[Math.floor(Math.random() * arr.length)];
  const w = () => rand(WORDS);
  const sym = SYMBOLS[Math.floor(Math.random() * SYMBOLS.length)];
  const chars = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789!@#$%^&*';
  let rnd = '';
  for (let i = 0; i < 16; i++) rnd += chars[Math.floor(Math.random() * chars.length)];
  const ww = w();
  return [
    `${w()}${sym}${w()}${Math.floor(Math.random()*90+10)}${w()}`,
    rnd,
    `${ww[0].toUpperCase()}${ww.slice(1)}-${w()}-${Math.floor(Math.random()*9000+1000)}`,
  ];
}

const alts = generateAlts();

function render() {
  const pw = pwInput.value;
  const sc = score(pw);

  if (sc === -1) {
    bar.style.width = '0%';
    strengthLabel.textContent = '—';
    strengthLabel.style.color = '#aaa';
    crackTime.textContent = '';
    checksGrid.innerHTML = '';
    entropyVal.textContent = charsetVal.textContent = lenVal.textContent = '0';
    suggestionsDiv.innerHTML = altDiv.innerHTML = '';
    return;
  }

  const lvl = LEVELS[sc];
  bar.style.width = lvl.pct + '%';
  bar.style.background = lvl.color;
  strengthLabel.textContent = lvl.label;
  strengthLabel.style.color = lvl.color;

  const e = entropy(pw);
  crackTime.textContent = `~${crackEstimate(e)} to crack`;
  entropyVal.textContent = e;
  charsetVal.textContent = charsetSize(pw);
  lenVal.textContent = pw.length;

  checksGrid.innerHTML = CHECKS.map(c => `
    <div class="check-item ${c.test(pw) ? 'pass' : ''}">
      <span class="check-icon">${c.test(pw) ? '<i class="ti ti-check"></i>' : ''}</span>
      <span>${c.label}</span>
    </div>`).join('');

  const feedback = buildFeedback(pw, sc);
  suggestionsDiv.innerHTML = feedback.length
    ? feedback.map(f => `<span class="suggestion-tag ${f.cls}">${f.text}</span>`).join('')
    : '<span style="font-size:13px;color:#888">No issues found.</span>';

  altDiv.innerHTML = alts.map((a, i) => `
    <div class="alt-card">
      <span class="alt-pw">${a}</span>
      <button class="copy-btn" id="cp${i}" onclick="copyPw(${i},'${a}')">Copy</button>
    </div>`).join('');
}

window.copyPw = (i, pw) => {
  navigator.clipboard.writeText(pw).then(() => {
    const btn = document.getElementById('cp' + i);
    btn.textContent = 'Copied!';
    setTimeout(() => btn.textContent = 'Copy', 1500);
  });
};

pwInput.addEventListener('input', render);
render();
</script>
</body>
</html>
